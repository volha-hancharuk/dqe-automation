[pytest]
# makes `src` importable regardless of where pytest is invoked from
pythonpath = ..
python_files = test_*.py
markers =
    parquet_data: data quality tests of Parquet datasets produced by the pipeline
    smoke: lightweight readiness checks (dataset exists and is not empty)
    example: framework usage samples from test_examples.py
    facility_name_min_time_spent_per_visit_date: dataset facility_name_min_time_spent_per_visit_date
    facility_type_avg_time_spent_per_visit_date: dataset facility_type_avg_time_spent_per_visit_date
    patient_sum_treatment_cost_per_facility_type: dataset patient_sum_treatment_cost_per_facility_type
