[pytest]
# marks
markers =
    validate_csv: tests that validate CSV file content
    unmarked: tests without any other mark (added automatically by a hook)
# python_files
python_files = test_*.py
# addopts
addopts = --html=report.html --reportportal

rp_endpoint = https://reportportal.epam.com
rp_project = VOLHA_HANCHARUK_PERSONAL
rp_launch = volha_hancharuk_pytest_intro
rp_launch_description = PyTest Introduction homework
rp_launch_attributes = homework:reportportal author:volha